name: EPG automatisch aktualisieren

on:
  schedule:
    - cron: '24 */2 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'build.py'
      - 'xtream_ppv.py'
      - 'provider_epg.py'
      - 'dashboard_data.py'
      - 'dashboard/**'
      - 'data/**'
      # Friend-only changes use the fast Pages publisher, not this generator.
      - '!data/friends.json'
      - '.github/workflows/update.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Dateien laden
        uses: actions/checkout@v4
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: PPV-Erkennung für USA und Deutschland testen
        run: python -m unittest -v test_ppv_categories.py
      - name: XMLTV aus DE und GR erzeugen
        env:
          XTREAM_M3U_URL: ${{ secrets.XTREAM_M3U_URL }}
        run: python build.py
      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v5
      - name: Webseite bereitstellen
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - name: Live schalten
        id: deployment
        uses: actions/deploy-pages@v4
