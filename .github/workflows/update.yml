name: EPG automatisch aktualisieren

on:
  schedule:
    - cron: '24 */2 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'build.py'
      - 'audit_de_gr.py'
      - 'test_audit_de_gr.py'
      - 'xtream_ppv.py'
      - 'named_categories.py'
      - 'name_matching.py'
      - 'placeholder_history.py'
      - 'real_epg_priority.py'
      - 'diagnostics.py'
      - 'test_diagnostics.py'
      - 'test_real_epg_priority.py'
      - 'test_placeholder_renaming.py'
      - 'test_general_name_matching.py'
      - 'test_named_categories.py'
      - 'test_name_normalization.py'
      - 'test_ppv_categories.py'
      - 'test_always_on_categories.py'
      - 'provider_epg.py'
      - 'dashboard_data.py'
      - 'dashboard/**'
      - 'data/**'
      # Friend-only changes use the fast Pages publisher, not this generator.
      - '!data/friends.json'
      - '.github/workflows/update.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Dateien laden
        uses: actions/checkout@v4
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: EPG-Zuordnungen und Filter testen
        run: |
          python -m unittest -v test_ppv_categories.py test_always_on_categories.py test_named_categories.py test_name_normalization.py test_general_name_matching.py test_placeholder_renaming.py test_real_epg_priority.py test_diagnostics.py test_audit_de_gr.py
          node --check dashboard/diagnostics.js
      - name: XMLTV aus DE und GR erzeugen
        env:
          XTREAM_M3U_URL: ${{ secrets.XTREAM_M3U_URL }}
        run: python build.py
      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v5
      - name: Webseite bereitstellen
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      # GitHub Actions artefact lookup can lag a few seconds after upload.
      # Give the Pages API time to index the new single-run artefact.
      - name: Auf Verfügbarkeit des Pages-Artefakts warten
        run: sleep 30
      - name: Live schalten
        id: deployment
        uses: actions/deploy-pages@v4
      # Audit runs only for code changes/manual runs, never every scheduled update.
      # New source programme data is not merged into or served by Pages.
      - name: Zusätzliche DE-GR EPG-Quellen vergleichen
        if: ${{ github.event_name != 'schedule' }}
        continue-on-error: true
        timeout-minutes: 4
        run: python audit_de_gr.py site/dashboard.json audit-results/coverage.json
      - name: Quellenvergleich als Bericht sichern
        if: ${{ github.event_name != 'schedule' && hashFiles('audit-results/coverage.json') != '' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: de-gr-coverage-audit
          path: audit-results/coverage.json
          retention-days: 7
